# D7: zestaw premierowy (8 kadrów, Play Console).
captionD7.1=Comandante e aura di battaglia
captionD7.2=Livelli delle torrette fino a 3
captionD7.3=Campagna attraverso le epoche
captionD7.4=Assedio infinito: carte e boss
captionD7.5=Medaglie e prossimo obiettivo
captionD7.6=Missioni del giorno
captionD7.7=Contrasto elevato e marcatori
captionD7.8=Assedio settimanale: Bronzo–Oro
altD7.1=Battaglia con il comandante dell'esercito blu e la sua aura, interfaccia completa con il pulsante del comandante.
altD7.2=Battaglia con il pannello delle torrette aperto: difese potenziate ai livelli 2 e 3.
altD7.3=Mappa della campagna con circa dieci tappe completate e stelle ottenute in più epoche.
altD7.4=Scelta tra tre carte dell'Assedio infinito durante un'ondata con boss, sopra la battaglia in corso.
altD7.5=Schermata di vittoria con stelle, medaglie separate per la battaglia e per gli obiettivi e prossimo traguardo.
altD7.6=Schermata missioni: serie di accessi di quattro giorni, missioni giornaliere e una missione da riscattare.
altD7.7=Battaglia con palette ad alto contrasto, marcatori squadra sopra le unità e testo ingrandito al 115%.
altD7.8=Schermata dell'Assedio settimanale con regole, premi e soglie Bronzo, Argento e Oro.
altD7.feature=Logo di Century War e un comandante alla guida dell'esercito blu sul campo di battaglia.
