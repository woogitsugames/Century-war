name: Testy symulacji JVM

on:
  # Oszczędność minut CI (3.11.2026): tylko PR do main i ręcznie.
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: Złote powtórki i testy JVM (bez Androida)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy :sim:test
        run: ./gradlew :sim:test -PserverOnly=true --console=plain --no-configuration-cache
      - name: Raport JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sim-jvm-test-reports
          path: |
            sim/build/reports/tests/test/
            sim/build/test-results/test/
            sim/build/ai-personality-profile.tsv
          if-no-files-found: warn
          retention-days: 14

  android-smoke:
    name: Kompilacja Android i testy aplikacji (SDK 36)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Zbuduj APK debug
        run: ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy tekstów, ekranu bitwy i odporności zapisów
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*LTest*' \
            --tests '*BattleScreenTest*' \
            --tests '*ProfileRecovery154Test*' \
            --tests '*HistoryRecovery154Test*' \
            --tests '*ReplayRecovery154Test*' \
            --tests '*ProfileRobustnessTest*' \
            --tests '*ProfileLoad160Test*' \
            --tests '*LifecycleProfile160Test*' \
            --tests '*DensityConfiguration160Test*' \
            --tests '*MusicLifecycle160Test*' \
            --tests '*BattleHistoryTest*' \
            --tests '*ReplayStoreTest*' \
            --console=plain --no-configuration-cache
