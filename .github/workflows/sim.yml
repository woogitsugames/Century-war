name: Testy symulacji JVM

on:
  push:
    branches: ['main', 'claude/**', 'gpt/**']
    paths:
      - 'sim/**'
      - 'docs/BALANCE.md'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/sim.yml'
  pull_request:
    paths:
      - 'sim/**'
      - 'docs/BALANCE.md'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Złote powtórki i testy JVM (bez Androida)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy :sim:test
        run: ./gradlew :sim:test -PserverOnly=true --console=plain --no-configuration-cache
      - name: Raport JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sim-jvm-test-reports
          path: |
            sim/build/reports/tests/test/
            sim/build/test-results/test/
            sim/build/ai-personality-profile.tsv
          if-no-files-found: warn
          retention-days: 14
