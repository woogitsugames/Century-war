name: Regeneracja złotych powtórek zlecenia 125
on:
  push:
    branches: ['gpt/125-commander']
    paths: ['.github/workflows/commander125-golden.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Wygeneruj wzorce i wpis audytowy
        run: |
          chmod +x ./gradlew
          ./gradlew :sim:regenerateGolden -PserverOnly=true -PgoldenReason='Dowodca w polu bitwy: nowy Replay v7, Snapshot v16 i uczciwe AI' --console=plain --no-configuration-cache
          git status --short
      - name: Commituj wzorce tylko na galaz zadania
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/src/test/resources/golden docs/BALANCE.md
          if ! git diff --cached --quiet; then
            git commit -m "125: zregeneruj złote powtórki po zmianie symulacji"
            git push origin HEAD:gpt/125-commander
          fi
