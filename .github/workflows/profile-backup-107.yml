name: Profile backup 107
on:
  push:
    branches:
      - 'gpt/107-profile-backup'
  pull_request:
    branches:
      - 'claude/bold-sagan-vwz5gm'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Sprawdzenie testów CI
        run: python3 scripts/ci_test_shards.py verify
      - name: Budowanie aplikacji i testy profilu
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
          ./gradlew :app:testDebugUnitTest --tests '*ProfileBackupTest*' --tests '*ProfileTest*' --tests '*LTest*' --console=plain --no-configuration-cache
      - name: Raporty testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-backup-107-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
