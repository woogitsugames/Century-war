name: Store 153 assets

on:
  push:
    branches:
      - 'gpt/153-store-assets'
    paths:
      - 'app/src/test/java/com/centurywar/screens/StoreGraphicsTest.kt'
      - 'app/src/test/resources/store/graphics_*.properties'
      - 'docs/store/listing_*.md'
      - 'docs/store/STORE_GRAPHICS.md'
      - 'scripts/validate_store153.py'
      - '.github/workflows/store-153.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-153-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-render:
    name: Build, test, render and attach PNG
    if: github.ref == 'refs/heads/gpt/153-store-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-configuration-cache --console=plain
      - name: Locale, manifest and screenshot generation tests
        env:
          STORE_GRAPHICS_153: 'true'
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*StoreGraphicsTest.storeAssetRequirements*' \
            --tests '*StoreGraphicsTest.listingLimits*' \
            --tests '*StoreGraphicsTest.generate153*' \
            --tests '*LTest*' \
            --no-configuration-cache --console=plain
      - name: Verify Google Play formats and all languages
        run: python3 scripts/validate_store153.py app/build/store153
      - name: Save PNG artifact
        uses: actions/upload-artifact@v4
        with:
          name: century-war-store153
          path: app/build/store153/
          if-no-files-found: error
          retention-days: 30
      - name: Attach PNG to the feature branch
        run: |
          mkdir -p docs/store/assets/153
          cp -a app/build/store153/pl docs/store/assets/153/
          cp -a app/build/store153/en docs/store/assets/153/
          cp -a app/build/store153/de docs/store/assets/153/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/store/assets/153
          if ! git diff --cached --quiet; then
            git commit -m 'Dołącz PNG grafik sklepowych Century War (153)'
            git push origin HEAD:gpt/153-store-assets
          fi
      - name: Store test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-store153-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
