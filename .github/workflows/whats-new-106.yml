name: Zlecenie 106 - Co nowego
on:
  push:
    branches:
      - gpt/106-whats-new
  pull_request:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whats-new-106-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  whats-new:
    name: APK, testy i zrzuty 106
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Zbuduj APK i sprawdź logikę oraz symulację
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
          ./gradlew :app:testDebugUnitTest \
            --tests '*WhatsNewCatalogTest*' \
            --tests '*WhatsNewScreenshotTest*' \
            --tests '*ProfileTest*' \
            --tests '*AboutScreenTest*' \
            --tests '*LTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Artefakty testów i zrzuty
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-whats-new-106
          path: |
            app/build/screenshots/whatsnew106_*.png
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
