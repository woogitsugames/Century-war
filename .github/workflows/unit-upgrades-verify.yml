name: Weryfikacja ulepszen jednostek

on:
  push:
    branches:
      - gpt/16-unit-upgrades
  pull_request:
    branches:
      - claude/bold-sagan-vwz5gm

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Platforma Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Zbuduj APK debug
        run: bash ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy bitwy, zapisu i lokalizacji
        run: |
          bash ./gradlew :app:testDebugUnitTest \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*LTest*' \
            --console=plain --no-configuration-cache
      - name: Test zrzutow ekranu menu
        run: |
          bash ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.menus*' \
            --console=plain --no-configuration-cache
      - name: Zalacz raport i zrzuty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-upgrades-logs-and-screenshots
          if-no-files-found: ignore
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/screenshots/
