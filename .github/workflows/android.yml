name: Android CI

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'gpt/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'claude/**'
      - 'gpt/**'
  workflow_dispatch:

permissions:
  contents: read

# Jeden aktywny przebieg na gałąź: stare kompilacje nie blokują najnowszego PR.
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK, lista wydania i licencje
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Testy narzędzi CI
        run: python3 -m unittest discover -s tests -p 'test_ci_tools.py' -v
      - name: Zbuduj APK i sprawdź listę wydania
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
          ./gradlew -p buildSrc test --console=plain --no-configuration-cache
      - name: Audyt licencji
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain --no-configuration-cache | tee release-runtime-dependencies.txt
          ./gradlew :server:dependencies --configuration runtimeClasspath -PserverOnly=true --console=plain --no-configuration-cache | tee server-runtime-dependencies.txt
          python3 scripts/check_license_inventory.py release-runtime-dependencies.txt server-runtime-dependencies.txt
      - name: Debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Raporty licencji
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-dependencies
          path: |
            release-runtime-dependencies.txt
            server-runtime-dependencies.txt
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: Testy (${{ matrix.shard }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: jvm, group: jvm, device: '' }
          - { shard: robolectric, group: robolectric, device: '' }
          - { shard: screen-phone720, group: screen-device, device: phone720 }
          - { shard: screen-phone20x9, group: screen-device, device: phone20x9 }
          - { shard: screen-foldOpen, group: screen-device, device: foldOpen }
          - { shard: screens-other, group: visual, device: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Robolectric
        if: ${{ matrix.group != 'jvm' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-sdk35-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-sdk35-
      - name: Sprawdź i uruchom przypisane testy
        env:
          CW_SCREENSHOT_DEVICE: ${{ matrix.device }}
          CI_TEST_GROUP: ${{ matrix.group }}
          PERF_REPORT: ${{ matrix.group == 'jvm' && 'true' || 'false' }}
          SFX_PREVIEW: ${{ matrix.group == 'jvm' && 'true' || 'false' }}
          MUSIC_PREVIEW: ${{ matrix.group == 'jvm' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          python3 scripts/ci_test_shards.py verify
          python3 scripts/ci_test_shards.py args "$CI_TEST_GROUP" > "$RUNNER_TEMP/ci-filters"
          mapfile -t filters < "$RUNNER_TEMP/ci-filters"
          ./gradlew :app:testDebugUnitTest "${filters[@]}" --console=plain --no-configuration-cache -PtestForks=1
      - name: Zrzuty PNG
        if: ${{ always() && (matrix.group == 'visual' || matrix.group == 'screen-device') }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-screenshots-${{ matrix.shard }}
          path: app/build/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Podglądy muzyki WAV
        if: ${{ always() && matrix.group == 'jvm' }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-music-preview
          path: app/build/music/*.wav
          if-no-files-found: warn
          retention-days: 14
      - name: Podglądy SFX WAV
        if: ${{ always() && matrix.group == 'jvm' }}
        uses: actions/upload-artifact@v4
        with:
          name: era-sfx-preview
          path: app/build/sfx/*.wav
          if-no-files-found: warn
          retention-days: 14
      - name: Raport testów
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cw-tests-${{ matrix.shard }}-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/ai-personality-profile.tsv
          if-no-files-found: warn
          retention-days: 14

  server-tests:
    name: Serwer i weryfikacja powtórek
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Uruchom testy serwera
        run: |
          chmod +x ./gradlew
          ./gradlew :server:test -PserverOnly=true --console=plain --no-configuration-cache
      - name: Raport serwera
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cw-tests-server-results
          name: century-war-screenshots
          path: app/build/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Zapisz raporty Robolectric
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: robolectric-test-reports
          path: |
            server/build/reports/tests/test/
            server/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

  test-timings:
    name: Raport czasu testów (top 20)
    needs: [tests, server-tests]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cw-tests-*-results
          path: ci-test-artifacts
      - name: Raport najwolniejszych testów
        run: |
          python3 scripts/ci_test_timings.py ci-test-artifacts --top 20 --output ci-test-timings.md
          cat ci-test-timings.md >> "$GITHUB_STEP_SUMMARY"
      - name: Zapisz raport czasu
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-ci-test-timings
          path: ci-test-timings.md
          if-no-files-found: warn
          retention-days: 14


  lint:
    name: Android Lint (nieblokujacy)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Wykonaj Lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintDebug --console=plain
      - name: Zapisz raport Lint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Podpisany release APK i AAB
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tag v* -> versionName (app/build.gradle.kts)
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Odtworz keystore z sekretow
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Brak sekretu ${name}; release nie moze byc podpisany kluczem debug."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/century-war-release.jks"
          (umask 077; printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore")
          echo "RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Zbuduj i podpisz APK i AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain
      - name: Zapisz release APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Zapisz release AAB
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90
      - name: Zapisz mapowanie R8 wydania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-release-mapping
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
          if-no-files-found: warn
          retention-days: 90
