name: Android CI

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'gpt/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'claude/**'
      - 'gpt/**'
  workflow_dispatch:

permissions:
  contents: read

# Jeden aktywny przebieg na gałąź: stare kompilacje nie blokują najnowszego PR.
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK, narzędzia CI i licencje
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kontrola kompletności testów i testy narzędzi
        run: |
          python3 scripts/ci_test_shards.py verify
          python3 scripts/ci_test_categories.py verify
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Zbuduj APK debug i przetestuj listę wydania
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
          ./gradlew -p buildSrc test --console=plain --no-configuration-cache
      - name: Audyt licencji
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain --no-configuration-cache | tee release-runtime-dependencies.txt
          ./gradlew :server:dependencies --configuration runtimeClasspath -PserverOnly=true --console=plain --no-configuration-cache | tee server-runtime-dependencies.txt
          python3 scripts/check_license_inventory.py release-runtime-dependencies.txt server-runtime-dependencies.txt
      - name: Testy listy kontrolnej wydania
        run: |
          chmod +x ./gradlew
          ./gradlew -p buildSrc test --console=plain --no-configuration-cache
      - name: Zbuduj APK i uruchom krytyczne testy
        env:
          PERF_REPORT: 'true'
          SFX_PREVIEW: 'true'
          MUSIC_PREVIEW: 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*WeatherTest*' \
            --tests '*DailyTest*' \
            --tests '*WeeklyTest*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --tests '*MotionTest*' \
            --tests '*ScoreClientTest*' \
            --tests '*ScoreQueueTest*' \
            --tests '*LTest*' \
            --tests '*SkirmishSetupTest*' \
            --tests '*AchievementsTest*' \
            --tests '*Achievement60Test*' \
          --tests '*HapticGateTest*' \
          --tests '*BattleHapticsTest*' \
            --tests '*CrashReportsTest*' \
            --tests '*SoundSynthTest*' \
            --tests '*SfxPreviewTest*' \
            --tests '*MusicSynthTest*' \
            --tests '*MusicThreadPerformanceTest*' \
            --tests '*MenuQualityTest*' \
            --tests '*MusicArrangementTest*' \
            --tests '*MusicPreviewTest*' \
            --tests '*AllocationTest*' \
            --tests '*SimPerformanceTest*' \
            --tests '*BattleIndexTest*' \
            --tests '*QualityGovernorTest*' \
            --tests '*FrameMetricsTest*' \
            --tests '*ReleaseConfigTest*' \
            --console=plain --no-configuration-cache
      - name: Drzewo zaleznosci wydania (audyt licencji)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain --no-configuration-cache | tee release-runtime-dependencies.txt
          ./gradlew :server:dependencies --configuration runtimeClasspath -PserverOnly=true --console=plain --no-configuration-cache | tee server-runtime-dependencies.txt
          python3 scripts/check_license_inventory.py release-runtime-dependencies.txt server-runtime-dependencies.txt
      - name: Zapisz podglądy muzyki WAV
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-music-preview
          path: app/build/music/*.wav
          if-no-files-found: warn
          retention-days: 14
      - name: Zapisz podglądy WAV
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: era-sfx-preview
          path: app/build/sfx/*.wav
          if-no-files-found: warn
          retention-days: 14
      - name: Zapisz debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Raporty licencji
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-dependencies
          path: |
            release-runtime-dependencies.txt
            server-runtime-dependencies.txt
          if-no-files-found: warn
          retention-days: 14

  fast-tests:
    name: Fast (app + sim + server)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Sprawdź, że :app:test nie uruchamia release
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:test --dry-run --console=plain --no-configuration-cache > "$RUNNER_TEMP/app-test-graph.txt"
          if grep -Eq ':app:(testReleaseUnitTest|releaseChecklist)( |$)' "$RUNNER_TEMP/app-test-graph.txt"; then
            cat "$RUNNER_TEMP/app-test-graph.txt"
            echo "::error::Domyślne testy uruchamiają release"
            exit 1
          fi
      - name: Testy szybkie i pomiar czasu
        env:
          SFX_PREVIEW: 'true'
          MUSIC_PREVIEW: 'true'
        run: |
          set -euo pipefail
          started=$(date +%s)
          set +e
          ./gradlew fastTest --console=plain --no-configuration-cache -PtestForks=2 > ci-test-fast.log 2>&1
          result=$?
          set -e
          cat ci-test-fast.log
          elapsed=$(( $(date +%s) - started ))
          printf '%s\n' "$elapsed" > ci-test-fast.duration
          printf 'Fast Gradle: **%s s** (cel: <600 s)\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Raporty testów fast
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cw-tests-fast-results
          path: |
            app/build/test-results/testDebugUnitTest/
            sim/build/test-results/test/
            server/build/test-results/test/
            ci-test-fast.duration
            ci-test-fast.log
          if-no-files-found: warn
          retention-days: 14

      - name: Podglądy dźwięków i muzyki
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cw-fast-audio-previews
          path: |
            app/build/music/*.wav
            app/build/sfx/*.wav
          if-no-files-found: warn
          retention-days: 14

  screenshot-tests:
    name: Screenshots (Robolectric)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-sdk35-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-sdk35-
      - name: Zrzuty wszystkich rozdzielczości i pomiar czasu
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          started=$(date +%s)
          set +e
          ./gradlew screenshotTest --console=plain --no-configuration-cache -PtestForks=1 > ci-test-screenshots.log 2>&1
          result=$?
          set -e
          cat ci-test-screenshots.log
          elapsed=$(( $(date +%s) - started ))
          printf '%s\n' "$elapsed" > ci-test-screenshots.duration
          printf 'Screenshots Gradle: **%s s**\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Zrzuty PNG i raporty
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cw-tests-screenshots-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/screenshots/
            ci-test-screenshots.duration
            ci-test-screenshots.log
          if-no-files-found: warn
          retention-days: 14

  balance-tests:
    name: Balance (długie symulacje i raporty)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BALANCE_RUN: 'true'
      BALANCE_RUNS: '2'
      BALANCE_PROFILE: target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Raporty balansu i pomiar czasu
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :server:test -PserverOnly=true --console=plain --no-configuration-cache
          started=$(date +%s)
          set +e
          ./gradlew balanceTest --console=plain --no-configuration-cache -PtestForks=2 > ci-test-balance.log 2>&1
          result=$?
          set -e
          cat ci-test-balance.log
          elapsed=$(( $(date +%s) - started ))
          printf '%s\n' "$elapsed" > ci-test-balance.duration
          printf 'Balance Gradle (2 seedy na etap): **%s s**\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Zapisz raporty serwera
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cw-tests-server-results
          path: server/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Raporty testów i balansu
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cw-tests-balance-results
          path: |
            app/build/test-results/testDebugUnitTest/
            sim/build/test-results/test/
            server/build/test-results/test/
            app/build/balance/
            ci-test-balance.duration
            ci-test-balance.log
          if-no-files-found: warn
          retention-days: 14

  test-timings:
    name: Czasy trzech kategorii i najwolniejsze testy
    needs: [fast-tests, screenshot-tests, balance-tests]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cw-tests-*-results
          path: ci-test-artifacts
      - name: Podsumuj czas ścienny i XML JUnit
        run: |
          set -euo pipefail
          {
            echo '# Czasy testów CI'
            echo
            echo '| Kategoria | Czas Gradle (s) |'
            echo '|---|---:|'
            for cat in fast screenshots balance; do
              path=$(find ci-test-artifacts -name "ci-test-$cat.duration" -print -quit)
              if [ -n "$path" ]; then
                echo "| $cat | $(cat "$path") |"
              else
                echo "| $cat | brak danych |"
              fi
            done
            echo
          } > ci-test-timings.md
          if find ci-test-artifacts -name 'TEST-*.xml' -print -quit | grep -q .; then
            python3 scripts/ci_test_timings.py ci-test-artifacts --top 20 >> ci-test-timings.md
          else
            echo 'Brak wyników XML JUnit (przerwano przed uruchomieniem testów).' >> ci-test-timings.md
          fi
          cat ci-test-timings.md >> "$GITHUB_STEP_SUMMARY"
      - name: Zapisz raport czasu
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-ci-test-timings
          path: ci-test-timings.md
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Android Lint (nieblokujacy)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Wykonaj Lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintDebug --console=plain
      - name: Zapisz raport Lint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Podpisany release APK i AAB
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tag v* -> versionName (app/build.gradle.kts)
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Odtworz keystore z sekretow
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Brak sekretu ${name}; release nie moze byc podpisany kluczem debug."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/century-war-release.jks"
          (umask 077; printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore")
          echo "RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Zbuduj i podpisz APK i AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain
      - name: Zapisz release APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Zapisz release AAB
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90
      - name: Zapisz mapowanie R8 wydania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-release-mapping
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
          if-no-files-found: warn
          retention-days: 90
