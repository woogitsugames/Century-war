name: Android CI

on:
  push:
    branches:
      - 'gpt/**'
  pull_request:
    branches:
      - 'claude/**'

permissions:
  contents: read

jobs:
  audit132:
    name: Budowanie i zrzuty 132
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Instalacja SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Budowanie
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy układu i regresji
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.tabletAudit132*' \
            --tests '*ScreenshotTest.layoutCollisions*' \
            --tests '*ScreenshotTest.regression100*' \
            --tests '*ScreenshotGoldenTest*' \
            --tests '*LTest*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Wyniki i PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-audit132-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/screenshots/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
