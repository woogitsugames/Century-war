name: Tymczasowa regeneracja wzorców Endless 108

on:
  push:
    branches: ['gpt/108-endless-cards-2']
    paths:
      - '.github/workflows/gpt108-refresh-golden.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/108-endless-cards-2
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Przelicz komplet dziesięciu złotych powtórek
        run: |
          ./gradlew :sim:regenerateGolden -PserverOnly=true \
            -PgoldenReason='Nowe karty i motywy Endless, format zrzutu v14' \
            --console=plain --no-configuration-cache
      - name: Commit wzorców do gałęzi zlecenia
        run: |
          git config user.name "Century War CI"
          git config user.email "actions@users.noreply.github.com"
          git add sim/src/test/resources/golden docs/BALANCE.md
          if ! git diff --cached --quiet; then
            git commit -m "Odśwież złote powtórki po rozszerzeniu Endless"
            git push origin HEAD:gpt/108-endless-cards-2
          fi
