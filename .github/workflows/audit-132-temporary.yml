name: Zlecenie 132 - kontrola Androida

on:
  push:
    branches:
      - gpt/132-tablet-layouts

permissions:
  contents: read

jobs:
  verify:
    name: Build i screenshoty 132
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Zbuduj APK debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy UI i wzorce
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.tabletAudit132*' \
            --tests '*ScreenshotTest.layoutCollisions*' \
            --tests '*ScreenshotTest.regression100*' \
            --tests '*ScreenshotGoldenTest*' \
            --tests '*LTest*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Zrzuty i wyniki testow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit132-screenshots
          path: |
            app/build/screenshots/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
