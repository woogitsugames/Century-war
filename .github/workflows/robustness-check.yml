name: Kontrola testów odporności

on:
  push:
    branches:
      - gpt/14-tests-robustness

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK 36
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Kompilacja debug
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Testy symulacji i odporności
        run: ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --tests '*RobustnessTest*' --console=plain
