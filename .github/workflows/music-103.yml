name: Muzyka 103 - build, testy i WAV

on:
  push:
    branches:
      - gpt/103-music-variety
  workflow_dispatch:

permissions:
  contents: read

jobs:
  music:
    name: Muzyka epok i natężenie bitwy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Zbuduj aplikację
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy muzyki, symulacji i zgodności zapisów
        env:
          MUSIC_PREVIEW: 'true'
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*MusicSynthTest*' \
            --tests '*MusicArrangementTest*' \
            --tests '*MusicVarietyTest*' \
            --tests '*MusicThreadPerformanceTest*' \
            --tests '*MusicPreviewTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*LTest*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Próbki WAV do odsłuchu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-103-27-wav
          path: app/build/music/*.wav
          if-no-files-found: warn
          retention-days: 30
      - name: Raport testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-103-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
