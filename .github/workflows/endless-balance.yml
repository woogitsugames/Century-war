name: Test balansu Endless (20 i 100 seedów)
on:
  pull_request:
    branches: ['claude/**']
    paths:
      - 'sim/**'
      - 'server/src/test/kotlin/com/centurywar/server/EndlessBalanceReportTest.kt'
      - '.github/workflows/endless-balance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balance:
    name: Porównanie fali AI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Zmodyfikowany kod
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :server:test -PserverOnly=true --tests '*EndlessBalanceReportTest*' --console=plain --no-configuration-cache --rerun-tasks | tee "$RUNNER_TEMP/new.log"
      - name: Kod bazowy
        run: |
          set -o pipefail
          git fetch origin claude/bold-sagan-vwz5gm
          base=$(git merge-base HEAD origin/claude/bold-sagan-vwz5gm)
          echo "ENDLESS_BASE=$base"
          git worktree add --detach "$RUNNER_TEMP/cw-baseline" "$base"
          cp server/src/test/kotlin/com/centurywar/server/EndlessBalanceReportTest.kt "$RUNNER_TEMP/cw-baseline/server/src/test/kotlin/com/centurywar/server/EndlessBalanceReportTest.kt"
          (cd "$RUNNER_TEMP/cw-baseline" && chmod +x ./gradlew && ./gradlew :server:test -PserverOnly=true --tests '*EndlessBalanceReportTest*' --console=plain --no-configuration-cache --rerun-tasks) | tee "$RUNNER_TEMP/old.log"
      - name: Porównanie średniej
        run: |
          old=$(grep -oE 'ENDLESS_MEAN=[0-9]+([.][0-9]+)?' "$RUNNER_TEMP/old.log" | tail -1 | cut -d= -f2)
          new=$(grep -oE 'ENDLESS_MEAN=[0-9]+([.][0-9]+)?' "$RUNNER_TEMP/new.log" | tail -1 | cut -d= -f2)
          old100=$(grep -oE 'ENDLESS100_MEAN=[0-9]+([.][0-9]+)?' "$RUNNER_TEMP/old.log" | tail -1 | cut -d= -f2)
          new100=$(grep -oE 'ENDLESS100_MEAN=[0-9]+([.][0-9]+)?' "$RUNNER_TEMP/new.log" | tail -1 | cut -d= -f2)
          test -n "$old" && test -n "$new" && test -n "$old100" && test -n "$new100"
          awk -v old="$old" -v now="$new" -v old100="$old100" -v new100="$new100" 'BEGIN {
            if (old <= 0 || old100 <= 0) exit 2;
            diff = (now-old)/old*100;
            diff100 = (new100-old100)/old100*100;
            printf "Endless 20 seedów: baza=%.2f, nowa=%.2f, zmiana=%+.2f%%\n", old, now, diff;
            printf "Endless 100 seedów: baza=%.2f, nowa=%.2f, zmiana=%+.2f%%\n", old100, new100, diff100;
            if (diff > 10) exit 1;
          }'
      - name: Logi balansu
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: endless-veteran-twenty-seed-balance
          path: |
            ${{ runner.temp }}/old.log
            ${{ runner.temp }}/new.log
          retention-days: 14
