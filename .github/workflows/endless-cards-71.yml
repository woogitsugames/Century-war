name: Test kart Endless 71

on:
  push:
    branches: ['gpt/71-endless-cards-2']
    paths:
      - 'sim/**'
      - 'app/src/main/java/com/centurywar/engine/L.kt'
      - 'app/src/main/java/com/centurywar/screens/BattleScreen.kt'
      - 'app/src/test/java/com/centurywar/game/*Endless*'
      - 'app/src/test/java/com/centurywar/game/BattleSnapshotTest.kt'
      - '.github/workflows/endless-cards-71.yml'
  pull_request:
    branches: ['claude/**']
    paths:
      - 'sim/**'
      - 'app/src/main/java/com/centurywar/engine/L.kt'
      - 'app/src/main/java/com/centurywar/screens/BattleScreen.kt'
      - 'app/src/test/java/com/centurywar/game/*Endless*'
      - 'app/src/test/java/com/centurywar/game/BattleSnapshotTest.kt'
      - '.github/workflows/endless-cards-71.yml'

permissions:
  contents: read

jobs:
  verify:
    name: APK, JUnit, snapshot, replay i serwer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: APK i testy reguł, kart, powtórek oraz języków
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest \
            --tests '*EndlessExpansion71Test*' \
            --tests '*EndlessCardsTest*' \
            --tests '*BattleSnapshotTest*' \
            --tests '*ReplayTest*' \
            --tests '*LTest*' \
            --console=plain --no-configuration-cache
      - name: Backend rankingów
        run: ./gradlew :server:test -PserverOnly=true --console=plain --no-configuration-cache
      - name: Raporty JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: endless71-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            server/build/reports/tests/test/
            server/build/test-results/test/
          retention-days: 14
