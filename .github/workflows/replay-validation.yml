name: Weryfikacja powtórek

on:
  push:
    branches:
      - gpt/07-replay-log
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalacja SDK 36
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: APK debug
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Testy bazowe
        run: ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --console=plain
      - name: Testy powtórek
        run: ./gradlew :app:testDebugUnitTest --tests '*ReplayTest*' --console=plain
