name: Regresja wizualna 100

on:
  push:
    branches:
      - gpt/100-screenshot-regression
  pull_request:
    branches:
      - claude/bold-sagan-vwz5gm
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cw-screens-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  initial-baselines:
    name: Pierwsze wzorce i weryfikacja
    if: github.event_name == 'push' && github.ref == 'refs/heads/gpt/100-screenshot-regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Jednorazowo wygeneruj 30 wzorców
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if test ! -f app/src/test/resources/screens/UPDATES.md; then
            if find app/src/test/resources/screens -name '*_reg100_*.png' -print -quit 2>/dev/null | grep -q .; then
              echo "Niepełny zestaw: nie aktualizuję automatycznie istniejących PNG."
              exit 1
            fi
            ./gradlew :app:updateScreenshots \
              -PscreenReason="Inicjalne wzorce 15 ekranów na dwóch urządzeniach" \
              --console=plain --no-configuration-cache -PtestForks=1
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/test/resources/screens/
            git commit -m "Dodaj pierwsze 30 wzorców regresji ekranów"
            git push origin HEAD:refs/heads/gpt/100-screenshot-regression
          fi
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Porównaj ekrany i przetestuj tolerancję
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.regression100*' \
            --tests '*ScreenshotGoldenTest*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Testy krytyczne
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*LTest*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Zrzuty i obrazy różnic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-regression-100
          path: |
            app/build/screenshots/**/*.png
            app/build/screenshots/diffs/*.txt
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  pull-request-check:
    name: Weryfikacja na PR
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Sprawdź wzorce bez aktualizacji
        run: |
          set -euo pipefail
          if test ! -f app/src/test/resources/screens/UPDATES.md; then
            echo "Wzorce nie zostały jeszcze scalone; porównanie rozpocznie się po PR 100."
            exit 0
          fi
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.regression100*' \
            --tests '*ScreenshotGoldenTest*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Zrzuty i obrazy różnic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-regression-pr
          path: |
            app/build/screenshots/**/*.png
            app/build/screenshots/diffs/*.txt
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
