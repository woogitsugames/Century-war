name: UX89 weryfikacja
on:
  push:
    branches:
      - gpt/89-settings-codex-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kompilacja APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy krytyczne
        run: |
          ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --tests '*BattleRulesTest*' --tests '*Snapshot*' --tests '*LTest*' --tests '*Replay*' --tests '*Counter*' --tests '*Endless*' --tests '*AiPersonality*' --console=plain --no-configuration-cache
      - name: Zrzuty i test kolizji zlecenia 89
        run: |
          ./gradlew :app:testDebugUnitTest --tests '*ScreenshotTest.settingsCodexUx89*' --console=plain --no-configuration-cache
      - name: Zrzuty PNG i raporty
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux89-screenshots-and-results
          path: |
            app/build/screenshots/*_89_*.png
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
