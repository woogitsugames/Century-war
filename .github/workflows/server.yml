name: Backend rankingów

on:
  push:
    branches: [gpt/08-server]
  pull_request:
    paths:
      - "server/**"
      - "sim/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/server.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy endpointów i weryfikatora
        run: ./gradlew :server:test --console=plain --info --stacktrace
      - name: Diagnostyka błędów testów
        if: failure()
        run: |
          find server/build/test-results/test -name '*.xml' -print -exec sed -n '1,220p' {} \; || true
          find server/build/reports/tests/test -name 'index.html' -print -exec sed -n '1,80p' {} \; || true

  android-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalacja Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Kompilacja aplikacji
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Test deterministyczności symulacji
        run: ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --tests '*BattleRulesTest*' --tests '*Snapshot*' --tests '*LTest*' --console=plain
