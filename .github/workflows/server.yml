name: Backend rankingów

# Build i testy aplikacji (w tym symulacji z :sim) wykonuje android.yml.
# Tu tylko :server, bez Android SDK (settings.gradle.kts pomija :app przy zadaniach :server:*).
on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'gpt/**'
    paths:
      - "server/**"
      - "sim/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "sim/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy endpointów i weryfikatora
        run: ./gradlew :server:test --console=plain --stacktrace
      - name: Zapisz raporty testów
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            server/build/reports/tests/test/
            server/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
