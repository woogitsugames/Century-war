name: Samouczek UX 85 - testy weryfikacyjne
on:
  push:
    branches:
      - gpt/85-tutorial-ux
  workflow_dispatch:
permissions:
  contents: read

jobs:
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [phone720, foldOpen]
    env:
      CW_SCREENSHOT_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Zbuduj APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Sprawdź teksty, potwierdzenie i wszystkie kroki
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*LTest*' \
            --tests '*TutorialUxTest*' \
            --tests '*ScreenshotTest.tutorial' \
            --console=plain --no-configuration-cache
      - name: Zachowaj zrzuty i raporty
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-ux-85-${{ matrix.device }}
          path: |
            app/build/screenshots/*.png
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  regressions:
    name: Regresje symulacji i powtórek
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Krytyczne testy regresji
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*LTest*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Raport testów regresji
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-ux-85-regressions
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
