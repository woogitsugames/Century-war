name: Pakiet źródeł symulacji 163

on:
  push:
    branches:
      - gpt/163-variant-balance

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cw-sim-sources-163
          path: |
            sim/src/main/kotlin/
            app/src/test/java/com/centurywar/game/BalanceReport.kt
          retention-days: 1
          if-no-files-found: error
