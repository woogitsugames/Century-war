name: Zlecenie 90 - nagrody i wydajnosc

on:
  push:
    branches:
      - gpt/90-feedback-perf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: APK i testy nagrod oraz regresji
        env:
          PERF_REPORT: 'true'
          CW_SCREENSHOT_DEVICE: phone720
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
          ./gradlew :app:testDebugUnitTest \
            --tests '*RewardFeedback90Test*' \
            --tests '*BaseFlashCache90Test*' \
            --tests '*LTest*' \
            --tests '*ReplayTest*' \
            --tests '*BattleSnapshotTest*' \
            --tests '*ScreenshotTest*' \
            --console=plain --no-configuration-cache
      - name: Zrzuty: stary i nowy blysk, ekrany
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-perf-90-screenshots
          path: app/build/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Raporty testow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-perf-90-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
