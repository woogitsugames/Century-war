name: Battle UX 84

on:
  push:
    branches:
      - gpt/84-battle-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kompilacja debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy UX, symulacji i tłumaczeń
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleScreenTest*' \
            --tests '*ScreenshotTest.battleUx84*' \
            --tests '*LTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Raporty i pięć formatów PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-battle-ux-84
          path: |
            app/build/screenshots/*battle84*.png
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
