name: Sztandary 124 - weryfikacja

on:
  push:
    branches:
      - gpt/124-banners
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Android SDK 36, testy i zrzuty
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Weryfikacja podziału testów
        run: |
          python3 scripts/ci_test_shards.py verify
          python3 scripts/ci_test_categories.py verify
      - name: Zbuduj aplikację
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Regresje symulacji, powtórek, tekstów i profilu
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*BannerProfileTest*' \
            --tests '*LTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --console=plain --no-configuration-cache
      - name: Zrzuty interfejsu sztandarów i bitwy
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*BannerScreenshotTest*' \
            --console=plain --no-configuration-cache
      - name: Zachowaj zrzuty
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sztandary124-zrzuty
          path: app/build/screenshots/banner124_*.png
          if-no-files-found: warn
          retention-days: 14
