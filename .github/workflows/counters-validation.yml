name: Walidacja kontr 06 (tymczasowa)

on:
  push:
    branches: [gpt/06-counters]

jobs:
  kotlin-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Symulacje JVM dla bazy i kontr
        shell: bash
        run: |
          set -euo pipefail
          TESTDIR="$RUNNER_TEMP/counters-jvm"
          mkdir -p "$TESTDIR/src/main/kotlin" "$TESTDIR/src/test/kotlin"
          cat > "$TESTDIR/settings.gradle.kts" <<'SETTINGS'
          rootProject.name = "century-war-counters-jvm"
          SETTINGS
          cat > "$TESTDIR/build.gradle.kts" <<'GRADLE'
          plugins { id("org.jetbrains.kotlin.jvm") version "2.2.20" }
          repositories { mavenCentral() }
          dependencies { testImplementation("junit:junit:4.13.2") }
          tasks.test {
              useJUnit()
              testLogging {
                  events("passed", "failed", "skipped")
                  showStandardStreams = true
              }
          }
          GRADLE
          for REF in claude/bold-sagan-vwz5gm gpt/06-counters; do
            git checkout --detach "origin/$REF"
            rm -f "$TESTDIR"/src/main/kotlin/*.kt "$TESTDIR"/src/test/kotlin/*.kt
            cp app/src/main/java/com/centurywar/game/{Defs,Battle,Ai,Modes,BattleSnapshot}.kt "$TESTDIR/src/main/kotlin/"
            cp app/src/main/java/com/centurywar/engine/L.kt "$TESTDIR/src/main/kotlin/"
            cp app/src/test/java/com/centurywar/game/{BattleSimTest,BattleRulesTest,BattleSnapshotTest}.kt "$TESTDIR/src/test/kotlin/"
            cp app/src/test/java/com/centurywar/engine/LTest.kt "$TESTDIR/src/test/kotlin/"
            if [ -f app/src/test/java/com/centurywar/game/CounterBattleSimTest.kt ]; then
              cp app/src/test/java/com/centurywar/game/CounterBattleSimTest.kt "$TESTDIR/src/test/kotlin/"
            fi
            echo "::group::Symulacja $REF"
            "$GITHUB_WORKSPACE/gradlew" --project-dir "$TESTDIR" --no-daemon clean test --console=plain
            echo "::endgroup::"
          done

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pobierz Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Zbuduj APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Testy symulacji i zrzutu
        run: ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --tests '*BattleRulesTest*' --tests '*Snapshot*' --tests '*LTest*' --console=plain
      - name: Zrzuty ekranów menu i Kodeksu
        run: ./gradlew :app:testDebugUnitTest --tests '*ScreenshotTest.menus*' --console=plain --no-configuration-cache
      - name: Zachowaj zrzuty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counters-codex-screenshots
          path: app/build/screenshots/**/*.png
          if-no-files-found: ignore
