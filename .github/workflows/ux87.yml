name: Sprawdzenie menu i Rekordów (87)

on:
  push:
    branches:
      - gpt/87-menu-rankings-ux
  workflow_dispatch:

permissions:
  contents: read

# Testujemy tylko najnowszy commit gałęzi; starsze przebiegi są zbędne.
concurrency:
  group: ux87-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Zbuduj APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy symulacji, tekstów i UI
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*LTest*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --tests '*MissionsUxTest*' \
            --tests '*RecordsUxTest*' \
            --tests '*ScreenshotTest.recordsUxFourFormats*' \
            --console=plain --no-configuration-cache
      - name: Zapisz zrzuty czterech formatów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-87-screenshots
          path: app/build/screenshots/*_87_*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Raport testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-87-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
