name: Kodeks - porownanie jednostek

on:
  push:
    branches:
      - gpt/134-codex-compare
    paths:
      - 'app/src/main/java/com/centurywar/screens/CodexCompare*'
      - 'app/src/main/java/com/centurywar/screens/CodexScreen.kt'
      - 'app/src/main/java/com/centurywar/engine/L.kt'
      - 'app/src/test/java/com/centurywar/screens/CodexCompare*'
      - '.github/workflows/codex-compare-134.yml'
  pull_request:
    branches:
      - 'claude/**'
    paths:
      - 'app/src/main/java/com/centurywar/screens/CodexCompare*'
      - 'app/src/main/java/com/centurywar/screens/CodexScreen.kt'
      - 'app/src/main/java/com/centurywar/engine/L.kt'
      - 'app/src/test/java/com/centurywar/screens/CodexCompare*'
      - '.github/workflows/codex-compare-134.yml'

permissions:
  contents: read

jobs:
  codex-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Zainstaluj SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Zbuduj debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Przetestuj model, jezyki i powtorki
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*CodexCompareModelTest*' \
            --tests '*CodexLTest*' \
            --tests '*LTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --console=plain --no-configuration-cache
      - name: Sprawdz cztery rozmiary i palete
        run: ./gradlew :app:testDebugUnitTest --tests '*CodexCompareScreenshotTest*' --console=plain --no-configuration-cache
      - name: Zrzuty i wyniki testow
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-134-screenshots-and-tests
          path: |
            app/build/screenshots/codex134_*.png
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
