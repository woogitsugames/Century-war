name: Testy czterech doktryn (69)

on:
  push:
    branches:
      - gpt/69-new-doctrines

permissions:
  contents: read

jobs:
  build-test-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Zbuduj debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy doktryn, symulacji, zapisu, powtorek i jezykow
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*Doctrine69*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --tests '*LTest*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Wypisz rzeczywiste wyniki 20 seedow
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          found = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for block in root.findall('system-out'):
                  for line in (block.text or '').splitlines():
                      if 'DOKTRYNA_69 ' in line:
                          print(line)
                          found += 1
              if 'Doctrine69' in path:
                  print(f'{path}: tests={root.get("tests")} failures={root.get("failures")} errors={root.get("errors")}')
          print(f'Liczba wynikow balansu: {found}')
          PY
      - name: Testy serwera
        if: always()
        run: ./gradlew :server:test -PserverOnly=true --console=plain --no-configuration-cache
      - name: Artefakty diagnostyczne i APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-doctrines-69
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
            server/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
