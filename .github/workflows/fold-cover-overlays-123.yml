name: Fold Cover overlays 123

on:
  push:
    branches:
      - 'gpt/123-fold-cover-overlays'
  pull_request:
    branches:
      - 'claude/bold-sagan-vwz5gm'
    paths:
      - 'app/src/main/java/com/centurywar/screens/EraIntroOverlay.kt'
      - 'app/src/test/java/com/centurywar/screens/ScreenshotTest.kt'
      - '.github/workflows/fold-cover-overlays-123.yml'

permissions:
  contents: read

jobs:
  fold-cover:
    name: Build APK and test overlays
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Screenshot and critical unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.foldCoverOverlays123*' \
            --tests '*LTest*' \
            --tests '*EraIntroBattleScreenTest*' \
            --tests '*EraIntroScreenshotTest*' \
            --console=plain --no-configuration-cache
      - name: Overlays PNG and JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fold-cover-overlays-123
          path: |
            app/build/screenshots/cover123_*.png
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
