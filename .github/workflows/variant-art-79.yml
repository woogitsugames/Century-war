name: Weryfikacja grafiki wariantow 79

on:
  push:
    branches:
      - gpt/79-variant-art
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variant-art:
    name: APK, galeria i zrzuty ekranow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Budowanie i testy graficzne
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest \
            --tests '*ArtGalleryTest*' \
            --tests '*ScreenshotTest*' \
            --console=plain --no-configuration-cache
      - name: Zrzuty wariantow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant-art-79-screenshots
          path: app/build/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Testowy APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant-art-79-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
