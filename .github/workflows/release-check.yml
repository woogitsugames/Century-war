name: Weryfikacja wydania Android

# Smoke-test release (R8 + shrinkResources) na emulatorze dla PR do main/claude/**
# i uruchomien recznych. Jawna flaga CI dopuszcza podpis debug — to NIE sa
# artefakty do publikacji; podpisany release buduje job `release` w android.yml po tagu v*.
on:
  pull_request:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 36
        uses: android-actions/setup-android@v4

      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Testy konfiguracji wydania
        run: |
          chmod +x ./gradlew
          mkdir -p build/release-metrics
          python3 -m unittest discover -s tests -p 'test_release_size_report.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_release_dex.py' -v
          ./gradlew :app:testDebugUnitTest --tests '*ReleaseConfigTest*' --console=plain

      - name: Potwierdź blokadę release bez klucza upload
        shell: bash
        run: |
          set -euo pipefail
          for task in :app:assembleRelease :app:bundleRelease; do
            log="build/release-metrics/blocked-${task#*:app:}.log"
            if ./gradlew "$task" \
              -PskipCheck=releaseDay,playGames,serverUrl,privacyUrl,hmacKey,versionCode \
              --console=plain --no-configuration-cache > "$log" 2>&1; then
              echo "::error::$task bez klucza produkcyjnego zakończył się sukcesem"
              exit 1
            fi
            grep -q 'Brak prawidłowego podpisu release' "$log" || {
              cat "$log"
              echo "::error::Brak oczekiwanego błędu podpisu w $task"
              exit 1
            }
          done

      # Porownanie na tych samych SDK/runnerze: najnowszy wspolny commit z baza PR.
      - name: Zbuduj bazowe APK i AAB (porownanie rozmiaru)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          base_sha="$(git merge-base HEAD "origin/$BASE_BRANCH")"
          echo "$base_sha" > build/release-metrics/base-sha.txt
          git worktree add --detach "$RUNNER_TEMP/cw-before" "$base_sha"
          # Od zlecenia 92 baza ma ID REPLACE_ME, a generator release je odrzuca:
          # podstawiamy ten sam syntetyczny zestaw co dla bieżącego commita.
          python3 scripts/ci_synthetic_play_games_ids.py \
            "$RUNNER_TEMP/cw-before/docs/store/play_games_ids.properties"
          # Dokument Data safety ma nierozstrzygniete decyzje wydawcy.
          # W smoke CI tymczasowo usuwamy znacznik; publikacyjna checklista zostaje bez zmian.
          sed -i 's/\[DO DECYZJI\]/[CI-SMOKE: decyzja przed publikacja]/g' \
            "$RUNNER_TEMP/cw-before/docs/store/data_safety.md"
          (
            cd "$RUNNER_TEMP/cw-before"
            chmod +x ./gradlew
            if grep -q 'ciTestDebugSigning' app/build.gradle.kts; then
              CW_RELEASE_SMOKE=true ./gradlew :app:assembleRelease :app:bundleRelease \
                -PciTestDebugSigning=true \
                -PskipCheck=releaseDay,playGames,serverUrl,privacyUrl,hmacKey,versionCode,ownerInput \
                --console=plain --no-configuration-cache
            else
              ./gradlew :app:assembleRelease :app:bundleRelease \
                -PskipCheck=releaseDay,playGames,serverUrl,privacyUrl,hmacKey,versionCode \
                --console=plain --no-configuration-cache
            fi
          )
          mkdir -p "$RUNNER_TEMP/cw-before-artifacts"
          cp "$RUNNER_TEMP/cw-before/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/cw-before-artifacts/before.apk"
          cp "$RUNNER_TEMP/cw-before/app/build/outputs/bundle/release/app-release.aab" "$RUNNER_TEMP/cw-before-artifacts/before.aab"
          git worktree remove --force "$RUNNER_TEMP/cw-before"

      # Smoke-test R8 wymaga technicznie pełnej konfiguracji release.
      # Te ID istnieją tylko w kontenerze CI, nie są produkcyjne ani commitowane.
      - name: Wstaw testowe dane konfiguracji tylko do smoke-testu
        shell: bash
        run: |
          python3 scripts/ci_synthetic_play_games_ids.py docs/store/play_games_ids.properties
          # Nie uzupelniamy danych wydawcy w repo; ten zamiennik istnieje tylko na runnerze.
          sed -i 's/\[DO DECYZJI\]/[CI-SMOKE: decyzja przed publikacja]/g' docs/store/data_safety.md

      # Smoke-test R8/manifestu na ID syntetycznych, nie do publikacji.
      - name: Zbuduj APK i AAB release
        env:
          CW_RELEASE_SMOKE: "true"
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain \
            -PciTestDebugSigning=true \
            -PskipCheck=releaseDay,playGames,serverUrl,privacyUrl,hmacKey,versionCode,ownerInput \
            2>&1 | tee build/release-metrics/release.log

      - name: Sprawdź rzeczywiste klasy DEX po R8
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_dex.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --dexdump "$ANDROID_HOME/build-tools/36.0.0/dexdump" \
            | tee build/release-metrics/dex-audit.txt
          grep -Ei '(^| )warning:|missing class' build/release-metrics/release.log \
            > build/release-metrics/r8-warnings.txt || true

      - name: Sprawdź manifest, profil i rozmiary
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"; test -s "$aab"
          unzip -Z -1 "$apk" | grep -E 'baseline\.prof(m)?$'
          unzip -Z -1 "$aab" | grep -E 'baseline\.prof(m)?$'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee build/release-metrics/manifest.txt
          grep -q "package: name='com.centurywar.game'" build/release-metrics/manifest.txt
          grep -q "launchable-activity: name='com.centurywar.MainActivity'" build/release-metrics/manifest.txt
          python3 scripts/release_size_report.py \
            --apk "$apk" \
            --aab "$aab" \
            --before-apk "$RUNNER_TEMP/cw-before-artifacts/before.apk" \
            --before-aab "$RUNNER_TEMP/cw-before-artifacts/before.aab" \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --usage app/build/outputs/mapping/release/usage.txt \
            --output build/release-metrics/rozmiary.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Zbuduj debug APK do pomiaru rozruchu
        run: ./gradlew :app:assembleDebug --console=plain --no-configuration-cache

      - name: Uruchom release na emulatorze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            apk_debug="app/build/outputs/apk/debug/app-debug.apk"
            apk_release="app/build/outputs/apk/release/app-release.apk"
            activity="com.centurywar.game/com.centurywar.MainActivity"

            # Debug: pelny cold start i raport StartupTimings z pierwszej klatki menu.
            adb install -r "$apk_debug"
            adb shell am force-stop com.centurywar.game
            adb logcat -c
            adb shell am start -W -n "$activity" | tee build/release-metrics/start-debug.txt
            grep -q '^Status: ok' build/release-metrics/start-debug.txt
            for i in $(seq 1 25); do
              adb logcat -d -s CWStartup:I '*:S' > build/release-metrics/startup-debug.log
              if grep -q 'Pierwsza klatka menu:' build/release-metrics/startup-debug.log; then break; fi
              sleep 1
            done
            grep 'Pierwsza klatka menu:' build/release-metrics/startup-debug.log

            # Release: oddzielna czysta instalacja, R8 i shrinkResources.
            adb uninstall com.centurywar.game
            adb install -r "$apk_release"
            adb shell am force-stop com.centurywar.game
            adb logcat -c
            adb shell am start -W -n "$activity" | tee build/release-metrics/start.txt
            grep -q '^Status: ok' build/release-metrics/start.txt
            sleep 8
            adb shell pidof com.centurywar.game
            adb logcat -d -s AndroidRuntime:E > build/release-metrics/androidruntime.log
            if grep -q "FATAL EXCEPTION" build/release-metrics/androidruntime.log; then cat build/release-metrics/androidruntime.log; exit 1; fi

      - name: Dołącz czas startu do raportu
        if: always()
        shell: bash
        run: |
          if test -s build/release-metrics/startup-debug.log; then
            {
              echo "### Rozruch na emulatorze API 35 (czyste instalacje)"
              echo ""
              echo "Debug — StartupTimings do pierwszej klatki menu:"
              echo ""
              echo '~~~'
              grep 'Pierwsza klatka menu:' build/release-metrics/startup-debug.log || true
              echo '~~~'
              echo ""
              echo "Release — ActivityManager am start -W:"
              echo ""
              echo '~~~'
              cat build/release-metrics/start.txt 2>/dev/null || true
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Zachowaj mapping i usage R8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-r8-mapping
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
            app/build/outputs/mapping/release/configuration.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Zachowaj raport i logi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-walidacja
          path: build/release-metrics/
          if-no-files-found: warn
