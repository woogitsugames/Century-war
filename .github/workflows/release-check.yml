name: Weryfikacja wydania Android

# Smoke-test release (R8 + shrinkResources) na emulatorze dla PR do main/claude/**
# i uruchomien recznych. Podpis: klucz debug (brak sekretow RELEASE_*) — to NIE sa
# artefakty do publikacji; podpisany release buduje job `release` w android.yml po tagu v*.
on:
  pull_request:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 36
        uses: android-actions/setup-android@v4

      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Testy konfiguracji wydania
        run: |
          chmod +x ./gradlew
          mkdir -p build/release-metrics
          python3 -m unittest discover -s tests -p 'test_release_size_report.py' -v
          ./gradlew :app:testDebugUnitTest --tests '*ReleaseConfigTest*' --console=plain

      # Porownanie na tych samych SDK/runnerze: najnowszy wspolny commit z baza PR.
      - name: Zbuduj bazowe APK i AAB (porownanie rozmiaru)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          base_sha="$(git merge-base HEAD "origin/$BASE_BRANCH")"
          echo "$base_sha" > build/release-metrics/base-sha.txt
          git worktree add --detach "$RUNNER_TEMP/cw-before" "$base_sha"
          (
            cd "$RUNNER_TEMP/cw-before"
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease :app:bundleRelease \
              -PskipCheck=releaseDay,playGames,serverUrl,privacyUrl,hmacKey,versionCode \
              --console=plain --no-configuration-cache
          )
          mkdir -p "$RUNNER_TEMP/cw-before-artifacts"
          cp "$RUNNER_TEMP/cw-before/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/cw-before-artifacts/before.apk"
          cp "$RUNNER_TEMP/cw-before/app/build/outputs/bundle/release/app-release.aab" "$RUNNER_TEMP/cw-before-artifacts/before.aab"
          git worktree remove --force "$RUNNER_TEMP/cw-before"

      # Smoke-test R8/manifestu na placeholderach, nie jest to walidacja publikacji.
      - name: Zbuduj APK i AAB release
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain -PskipCheck=releaseDay,playGames,serverUrl,privacyUrl,hmacKey,versionCode 2>&1 | tee build/release-metrics/release.log

      - name: Sprawdź manifest, profil i rozmiary
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"; test -s "$aab"
          unzip -Z -1 "$apk" | grep -E 'baseline\.prof(m)?$'
          unzip -Z -1 "$aab" | grep -E 'baseline\.prof(m)?$'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee build/release-metrics/manifest.txt
          grep -q "package: name='com.centurywar.game'" build/release-metrics/manifest.txt
          grep -q "launchable-activity: name='com.centurywar.MainActivity'" build/release-metrics/manifest.txt
          python3 scripts/release_size_report.py \
            --apk "$apk" \
            --aab "$aab" \
            --before-apk "$RUNNER_TEMP/cw-before-artifacts/before.apk" \
            --before-aab "$RUNNER_TEMP/cw-before-artifacts/before.aab" \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --usage app/build/outputs/mapping/release/usage.txt \
            --output build/release-metrics/rozmiary.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Uruchom release na emulatorze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.centurywar.game/com.centurywar.MainActivity | tee build/release-metrics/start.txt
            grep -q '^Status: ok' build/release-metrics/start.txt
            sleep 8
            adb shell pidof com.centurywar.game
            adb logcat -d -s AndroidRuntime:E > build/release-metrics/androidruntime.log
            if grep -q "FATAL EXCEPTION" build/release-metrics/androidruntime.log; then cat build/release-metrics/androidruntime.log; exit 1; fi

      - name: Zachowaj mapping i usage R8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-r8-mapping
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
            app/build/outputs/mapping/release/configuration.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Zachowaj raport i logi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-walidacja
          path: build/release-metrics/
          if-no-files-found: warn
