name: Migawka źródeł do pomiarów

on:
  pull_request:
    branches: [claude/bold-sagan-vwz5gm]

concurrency:
  group: source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Archiwum źródeł
        run: tar --exclude=.git --exclude=source.tar.gz -czf source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: century-war-source
          path: source.tar.gz
          if-no-files-found: error
