name: Lokalizacja 120 - testy
on:
  push:
    branches:
      - gpt/120-l10n-review-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l10n:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: APK debug
        run: ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy lokalizacji
        run: ./gradlew :app:testDebugUnitTest --tests '*LTest*' --console=plain --no-configuration-cache
      - name: Zrzuty lokalizacji 120
        run: ./gradlew :app:testDebugUnitTest --tests '*Localization120ScreenshotTest*' --console=plain --no-configuration-cache
      - name: Wyniki i zrzuty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-l10n120-report
          path: |
            app/build/screenshots/l10n120_*.png
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
