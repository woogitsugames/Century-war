name: Weryfikacja Endless 2.0

on:
  push:
    branches:
      - gpt/13-endless-cards
  workflow_dispatch:

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Kompilacja debug
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Testy symulacji
        run: ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --console=plain
      - name: Testy kart Endless
        run: ./gradlew :app:testDebugUnitTest --tests '*EndlessCardsTest*' --console=plain
