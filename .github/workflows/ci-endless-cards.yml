name: Weryfikacja Endless 2.0

on:
  push:
    branches:
      - gpt/13-endless-cards
  workflow_dispatch:

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
      - name: Kompilacja debug
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Testy symulacji
        run: ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --console=plain
      - name: Testy kart Endless
        run: ./gradlew :app:testDebugUnitTest --tests '*EndlessCardsTest*' --console=plain
