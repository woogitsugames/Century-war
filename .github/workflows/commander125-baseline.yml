name: Pomiar bazowy kampanii dla zlecenia 125
on:
  push:
    branches: ['gpt/125-commander']
    paths: ['.github/workflows/commander125-baseline.yml']
permissions:
  contents: read

jobs:
  stages:
    name: Baza - etapy ${{ matrix.range }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { range: '01-06', stages: '1,2,3,4,5,6' }
          - { range: '07-12', stages: '7,8,9,10,11,12' }
          - { range: '13-18', stages: '13,14,15,16,17,18' }
          - { range: '19-24', stages: '19,20,21,22,23,24' }
          - { range: '25-30', stages: '25,26,27,28,29,30' }
          - { range: '31-36', stages: '31,32,33,34,35,36' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bold-sagan-vwz5gm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Raport bazowy 36 etapow po 20 seedow
        env:
          BALANCE_RUN: 'true'
          BALANCE_RUNS: '20'
          BALANCE_PROFILE: target
          BALANCE_STAGES: ${{ matrix.stages }}
          PERF_REPORT: 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --rerun-tasks \
            --tests '*BalanceReport.campaignReport*' \
            --console=plain --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: commander125-before-${{ matrix.range }}
          path: app/build/balance/report-*.csv
          if-no-files-found: warn
          retention-days: 14
