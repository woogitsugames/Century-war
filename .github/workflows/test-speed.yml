name: Pomiar pełnego zestawu testów

on:
  pull_request:
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/test/**'
      - 'gradle/test-categories.properties'
      - 'scripts/ci_test_shards.py'
      - '.github/workflows/test-speed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: App + sim + server (czas ścienny)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Weryfikuj shardy, kategorie i narzędzia
        run: |
          python3 scripts/ci_test_shards.py verify
          python3 scripts/ci_test_categories.py verify
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Zmierz pełne testy
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          started=$(date +%s)
          set +e
          ./gradlew :app:testDebugUnitTest :sim:test :server:test \
            --console=plain --no-configuration-cache -PtestForks=2 \
            > ci-test-full.log 2>&1
          result=$?
          set -e
          tail -n 150 ci-test-full.log
          elapsed=$(( $(date +%s) - started ))
          printf '%s\n' "$elapsed" > ci-test-full.duration
          printf 'Pełny Gradle: **%s s** (cel: <1500 s)\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          if find app/build/test-results sim/build/test-results server/build/test-results \
            -name 'TEST-*.xml' -print -quit 2>/dev/null | grep -q .; then
            python3 scripts/ci_test_timings.py \
              app/build/test-results/testDebugUnitTest \
              sim/build/test-results/test \
              server/build/test-results/test \
              --top 20 --output ci-test-full-timings.md
            cat ci-test-full-timings.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: XML, czasy i log Gradle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cw-full-suite-speed-results
          path: |
            app/build/test-results/testDebugUnitTest/
            sim/build/test-results/test/
            server/build/test-results/test/
            ci-test-full.log
            ci-test-full.duration
            ci-test-full-timings.md
          if-no-files-found: warn
          retention-days: 14
