name: Low-end performance 101

on:
  push:
    branches:
      - 'gpt/101-low-end-perf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-end:
    name: Budowanie i testy wydajności LOW
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy regresji i symulacji
        env:
          PERF_REPORT: 'true'
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*StartupTimingsTest*' \
            --tests '*BitmapCacheBudgetTest*' \
            --tests '*BattleCrowdPerformance101Test*' \
            --tests '*BaseFlashCache90Test*' \
            --tests '*StartupTest*' \
            --tests '*BattleScreenAllocationTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*LTest*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Raporty testów
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: low-end-perf-101-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
