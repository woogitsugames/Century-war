name: Task 130 validation

on:
  push:
    branches:
      - gpt/130-achievements-missions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compile and achievement/mission tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Sprawdź kompletność selektorów testów
        run: |
          python3 scripts/ci_test_shards.py verify
          python3 scripts/ci_test_categories.py verify
      - name: Sprawdź generator Play Games
        run: |
          chmod +x ./gradlew
          ./gradlew -p buildSrc test --console=plain --no-configuration-cache
      - name: Assemble debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Achievement and mission tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*Achievement130Test*' \
            --tests '*Mission130Test*' \
            --tests '*AchievementsTest*' \
            --tests '*Achievement60Test*' \
            --tests '*MissionsTest*' \
            --tests '*LTest*' \
            --tests '*PlayGamesIdsTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: task-130-tests
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
