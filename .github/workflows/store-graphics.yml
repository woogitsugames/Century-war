name: Store graphics

on:
  push:
    branches:
      - 'gpt/50-store-graphics'
      - 'gpt/75-store-refresh'
    paths:
      - 'app/src/test/java/com/centurywar/screens/StoreGraphicsTest.kt'
      - 'app/src/test/resources/store/**'
      - 'docs/store/STORE_GRAPHICS.md'
      - 'docs/store/listing_*.md'
      - 'docs/store/screenshots_plan.md'
      - '.github/workflows/store-graphics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-graphics:
    name: Generuj grafiki sklepu PL/EN
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-store-${{ runner.os }}-sdk35-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-sdk35-
      - name: Wykonaj generator PL i EN
        env:
          STORE_GRAPHICS: 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests '*StoreGraphicsTest*' --no-configuration-cache --console=plain
      - name: Udostepnij grafiki
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-store-graphics
          path: app/build/store/
          if-no-files-found: warn
          retention-days: 14
      - name: Raport testu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-store-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
