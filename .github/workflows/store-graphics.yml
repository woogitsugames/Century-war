name: Store 157 temporary generation

on:
  push:
    branches:
      - 'gpt/157-store-victory'
    paths:
      - 'app/src/test/java/com/centurywar/screens/StoreGraphicsTest.kt'
      - '.github/workflows/store-graphics.yml'

permissions:
  contents: write

jobs:
  generate153:
    name: Sprawdź i odtwórz grafiki 153
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kompilacja aplikacji
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy i generowanie grafik 153
        env:
          STORE_GRAPHICS_153: 'true'
        run: |
          ./gradlew :app:testDebugUnitTest --tests '*StoreGraphicsTest*' --tests '*LTest*' --console=plain --no-configuration-cache
          python3 scripts/validate_store153.py app/build/store153/
      - name: Zachowaj niezmienione grafiki oraz przygotuj nowe
        run: |
          python3 - <<'PY'
          import filecmp
          import shutil
          from hashlib import sha256
          from pathlib import Path
          base = Path("docs/store/assets/153")
          produced = Path("app/build/store153")
          updated = 0
          preserved = {}
          for lang in ("pl", "en", "de"):
              for device in ("phone16x9", "phone20x9_qa", "tablet10", "fold"):
                  for scene in ("03-campaign-map.png", "04-endless-cards.png"):
                      image = base/lang/device/scene
                      preserved[image] = sha256(image.read_bytes()).hexdigest()
              image = base/lang/"feature_1024x500.png"
              preserved[image] = sha256(image.read_bytes()).hexdigest()
          for lang in ("pl", "en", "de"):
              for device in ("phone16x9", "phone20x9_qa", "tablet10", "fold"):
                  dest = base/lang/device
                  src = produced/lang/device
                  for scene in ("03-campaign-map.png", "04-endless-cards.png"):
                      if not filecmp.cmp(src/scene, dest/scene, shallow=False):
                          print(f"Inna rasteryzacja, zachowano oryginał: {lang}/{device}/{scene}")
                  for scene in ("01-commander-aura.png", "02-turret-tiers.png", "05-battle-chart.png"):
                      shutil.copyfile(src/scene, dest/scene)
                      updated += 1
              if not filecmp.cmp(produced/lang/"feature_1024x500.png", base/lang/"feature_1024x500.png", shallow=False):
                  print(f"Inna rasteryzacja, zachowano oryginał: {lang}/feature_1024x500.png")
              shutil.copyfile(produced/lang/"preview_contact.png", base/lang/"preview_contact.png")
              shutil.copyfile(produced/lang/"manifest.tsv", base/lang/"manifest.tsv")
          assert all(sha256(path.read_bytes()).hexdigest() == checksum
                     for path, checksum in preserved.items()), "Zmieniono obraz spoza zakresu"
          print(f"Odtworzono {updated} grafik bitwy, 3 stykówki i 3 manifesty")
          print(f"Bez zmian zachowano {len(preserved)} oryginalnych PNG")
          PY
          python3 scripts/validate_store153.py docs/store/assets/153/
      - name: Zapisz wygenerowane PNG na gałęzi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/store/assets/153/
          if ! git diff --cached --quiet; then
            git commit -m "Odśwież grafiki sklepu po zwycięskiej bitwie"
            git push origin HEAD:gpt/157-store-victory
          fi
      - name: Raporty testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-157-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/store153/pl/preview_contact.png
            app/build/store153/en/preview_contact.png
            app/build/store153/de/preview_contact.png
          if-no-files-found: warn
          retention-days: 14
