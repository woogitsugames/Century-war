name: Battle Summary 104

on:
  push:
    branches:
      - gpt/104-battle-summary
  pull_request:
    branches:
      - claude/bold-sagan-vwz5gm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Zainstaluj Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy wykresu, powtórek, symulacji i tłumaczeń
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleSummaryTest*' \
            --tests '*BattleSummaryScreenshotTest*' \
            --tests '*BattleScreenTest*' \
            --tests '*ReplayScreenTest*' \
            --tests '*LTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Zrzuty i raporty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: century-war-battle-summary-104
          path: |
            app/build/screenshots/battle104_*.png
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
