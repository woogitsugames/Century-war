name: Tymczasowa regeneracja zlotych powtorek 95
on:
  push:
    branches: ['gpt/95-endless-late-balance']
    paths: ['.github/workflows/golden-95.yml']
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Regeneruj 10 zlotych powtorek z uzasadnieniem
        run: |
          chmod +x ./gradlew
          ./gradlew :sim:regenerateGolden -PserverOnly=true -PgoldenReason="Zlecenie 95: audyt 100 seedow, bez zmiany skalowania" --console=plain --no-configuration-cache
      - name: Sprawdz zmiany wzorcow i podaj sumy
        run: |
          git status --short
          git diff --stat -- sim/src/test/resources/golden docs/BALANCE.md
          sha256sum sim/src/test/resources/golden/*.json
      - name: Pomiar 100 seedow po zmianach zadania 108
        run: |
          set -o pipefail
          git fetch origin gpt/108-endless-cards-2
          echo "ENDLESS108_COMMIT=$(git rev-parse FETCH_HEAD)"
          git worktree add --detach "$RUNNER_TEMP/cw-108" FETCH_HEAD
          cp server/src/test/kotlin/com/centurywar/server/EndlessBalanceReportTest.kt "$RUNNER_TEMP/cw-108/server/src/test/kotlin/com/centurywar/server/EndlessBalanceReportTest.kt"
          (cd "$RUNNER_TEMP/cw-108" && chmod +x ./gradlew && ./gradlew :server:test -PserverOnly=true --tests '*EndlessBalanceReportTest.veteranHundredSeeds' --console=plain --no-configuration-cache --rerun-tasks) | tee "$RUNNER_TEMP/108.log"
          grep -E 'ENDLESS100_(MEAN|FAILURES|DEFEAT_MEDIAN|SURVIVE_[0-9]+|DISTRIBUTION)=' "$RUNNER_TEMP/108.log"
      - name: Zachowaj regenerowane wzorce
        uses: actions/upload-artifact@v4
        with:
          name: zlecenie-95-golden
          path: |
            sim/src/test/resources/golden/
            docs/BALANCE.md
          retention-days: 14
