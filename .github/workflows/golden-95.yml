name: Jednorazowy pomiar Endless 95 po kartach 108
on:
  push:
    branches: ['gpt/95-endless-late-balance']
    paths: ['.github/workflows/golden-95.yml']
permissions:
  contents: read
jobs:
  after108:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Porownaj 100 seedow na bazie oraz na zadaniu 108
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :server:test -PserverOnly=true --tests '*EndlessBalanceReportTest.veteranHundredSeeds' --console=plain --no-configuration-cache --rerun-tasks | tee "$RUNNER_TEMP/before108.log"
          git fetch origin gpt/108-endless-cards-2
          echo "ENDLESS108_COMMIT=$(git rev-parse FETCH_HEAD)"
          git worktree add --detach "$RUNNER_TEMP/cw-108" FETCH_HEAD
          cp server/src/test/kotlin/com/centurywar/server/EndlessBalanceReportTest.kt "$RUNNER_TEMP/cw-108/server/src/test/kotlin/com/centurywar/server/EndlessBalanceReportTest.kt"
          (cd "$RUNNER_TEMP/cw-108" && chmod +x ./gradlew && ./gradlew :server:test -PserverOnly=true --tests '*EndlessBalanceReportTest.veteranHundredSeeds' --console=plain --no-configuration-cache --rerun-tasks) | tee "$RUNNER_TEMP/after108.log"
          grep -E 'ENDLESS100_(MEAN|FAILURES|DEFEAT_MEDIAN|SURVIVE_[0-9]+|DISTRIBUTION)=' "$RUNNER_TEMP/before108.log" "$RUNNER_TEMP/after108.log"
      - name: Zachowaj logi 100 seedow
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: endless-95-after108-comparison
          path: |
            ${{ runner.temp }}/before108.log
            ${{ runner.temp }}/after108.log
          if-no-files-found: warn
          retention-days: 14
