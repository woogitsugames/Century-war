name: Kontrola zlecenia 68

on:
  push:
    branches: ['gpt/68-era-intros']
  pull_request:
    branches: ['claude/bold-sagan-vwz5gm']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: era68-robolectric-sdk35
      - name: Zbuduj debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy zapowiedzi, powtórek, symulacji i języków
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*EraIntroBattleScreenTest*' \
            --tests '*EraIntroScreenshotTest*' \
            --tests '*LTest*' \
            --tests '*BattleSimTest*' \
            --tests '*Replay*' \
            --console=plain --no-configuration-cache
      - name: Raporty i sześć zrzutów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: era68-tests-and-screenshots
          path: |
            app/build/screenshots/era68_*.png
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
      - name: APK testowe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: era68-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
