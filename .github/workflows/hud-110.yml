name: HUD leworeczny 110

on:
  push:
    branches:
      - gpt/110-left-handed-hud
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hud110:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kompilacja APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy HUD, profilu, jezykow i symulacji
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*LeftHandedHud*' \
            --tests '*LTest*' \
            --tests '*BattleSimTest*' \
            --tests '*Replay*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Wyniki i zrzuty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud110-wyniki
          path: |
            app/build/screenshots/hud110_*.png
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
