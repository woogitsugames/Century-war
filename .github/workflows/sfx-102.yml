name: SFX 102 - build i probki WAV

on:
  push:
    branches:
      - 'gpt/102-sfx-polish'
  pull_request:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sfx:
    name: Kompilacja, testy i WAV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: APK debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy DSP i eksport probek
        env:
          SFX_PREVIEW: 'true'
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*SoundSynthTest*' \
            --tests '*SfxMixTest*' \
            --tests '*SfxPreviewTest*' \
            --console=plain --no-configuration-cache -PtestForks=1
      - name: Probki WAV do odsluchu PR
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-sfx-102-wav
          path: app/build/sfx/*.wav
          if-no-files-found: warn
          retention-days: 14
      - name: Wyniki testow
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: century-war-sfx-102-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
