name: PGS — Android build i testy

on:
  push:
    branches:
      - gpt/01-play-games
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Budowanie APK debug
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Test deterministycznej symulacji
        run: ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --console=plain
      - name: Test zapisu i konfliktów PGS
        run: ./gradlew :app:testDebugUnitTest --tests '*ProfileCloudTest*' --console=plain
