name: PGS — Android build i testy

on:
  push:
    branches:
      - gpt/01-play-games
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Budowanie APK debug
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Testy deterministyczne i zapisu bitwy
        run: ./gradlew :app:testDebugUnitTest --tests '*BattleSimTest*' --tests '*BattleRulesTest*' --tests '*Snapshot*' --console=plain
      - name: Testy tłumaczeń, profilu i chmury
        run: ./gradlew :app:testDebugUnitTest --tests '*LTest*' --tests '*ProfileTest*' --tests '*ProfileCloudTest*' --no-configuration-cache --console=plain
