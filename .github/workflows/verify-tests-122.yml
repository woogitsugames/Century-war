name: Testy akceptacyjne 122
on:
  push:
    branches: ['gpt/122-endless-modifiers']
    paths:
      - '.github/workflows/verify-tests-122.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kompilacja i testy akceptacyjne
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*LTest*' \
            --tests '*Replay*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Raport JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-122-acceptance-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
