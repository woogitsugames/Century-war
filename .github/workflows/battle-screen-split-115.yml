name: Weryfikacja podzialu ekranu bitwy 115

on:
  push:
    branches:
      - gpt/115-battle-screen-split
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-screen-115-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kompilacja APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy jednostkowe bitwy i ekranu
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleScreenTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --tests '*LTest*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Zrzuty 720p i Fold
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.menus*' \
            --tests '*ScreenshotTest.battleUx84*' \
            --tests '*ScreenshotTest.barrageDuringBattle*' \
            --console=plain --no-configuration-cache
      - name: Wygeneruj wzorce z commita bazowego
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/cw115-baseline" 487a82b2bbb513dbee7eb4e4e52055c079416b2f
          cd "$RUNNER_TEMP/cw115-baseline"
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.menus*' \
            --tests '*ScreenshotTest.battleUx84*' \
            --tests '*ScreenshotTest.barrageDuringBattle*' \
            --console=plain --no-configuration-cache
          mkdir -p "$GITHUB_WORKSPACE/app/build/baseline-screenshots"
          find app/build/screenshots -type f -name '*_battle_*.png' \
            -exec cp '{}' "$GITHUB_WORKSPACE/app/build/baseline-screenshots/" \;
      - name: Porownaj zrzuty bitwy bajt po bajcie
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, sys

          root = Path("app/build")
          baseline = root / "baseline-screenshots"
          actual = root / "screenshots"
          originals = sorted(baseline.glob("*_battle_*.png"))
          if not originals:
              sys.exit("BRAK ZRZUTOW BAZOWYCH — porownanie nie wykonane")
          errors = []
          for old in originals:
              new = actual / old.name
              if not new.exists():
                  errors.append(f"BRAK: {old.name}")
                  continue
              if hashlib.sha256(old.read_bytes()).digest() != hashlib.sha256(new.read_bytes()).digest():
                  errors.append(f"ROZNICA: {old.name}")
          print(f"Porownano {len(originals)} zrzutow ekranu bitwy z commitem bazowym")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("OK: wszystkie zrzuty bitwy sa identyczne bajt po bajcie")
          PY
      - name: Artefakty zrzutow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-screen-115-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
