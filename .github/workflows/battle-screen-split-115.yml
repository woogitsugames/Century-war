name: Weryfikacja podzialu ekranu bitwy 115

on:
  push:
    branches:
      - gpt/115-battle-screen-split
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-screen-115-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kompilacja APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy jednostkowe bitwy i ekranu
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleScreenTest*' \
            --tests '*BattleSimTest*' \
            --tests '*BattleRulesTest*' \
            --tests '*Snapshot*' \
            --tests '*Replay*' \
            --tests '*LTest*' \
            --tests '*Counter*' \
            --tests '*Endless*' \
            --tests '*AiPersonality*' \
            --console=plain --no-configuration-cache
      - name: Zrzuty 720p i Fold
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*ScreenshotTest.menus*' \
            --tests '*ScreenshotTest.battleUx84*' \
            --console=plain --no-configuration-cache
      - name: Artefakty zrzutow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-screen-115-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
