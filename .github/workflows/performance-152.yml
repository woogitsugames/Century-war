name: Performance 152

on:
  push:
    branches:
      - gpt/152-lowend-perf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lowend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: APK i regresje wydajności
        env:
          PERF_REPORT: 'true'
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache 2>&1 | tee perf-152-build.log
          ./gradlew :app:testDebugUnitTest \
            --tests '*BattleCrowdPerformance101Test*' \
            --tests '*BattleScreenAllocationTest*' \
            --tests '*LowEndScreensPerformanceTest*' \
            --tests '*ReplayTest*' \
            --tests '*ScreenshotGoldenTest*' \
            --console=plain --no-configuration-cache 2>&1 | tee perf-152-tests.log
      - name: Logi pomiarów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-152-logs
          path: |
            perf-152-*.log
            app/build/test-results/testDebugUnitTest/
            app/build/screenshots/
          if-no-files-found: warn
          retention-days: 14
