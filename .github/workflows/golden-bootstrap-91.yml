name: Tymczasowe generowanie złotych powtórek 91

on:
  push:
    branches: ['gpt/91-golden-tests']
    paths:
      - 'sim/**'
      - '.github/workflows/golden-bootstrap-91.yml'

permissions:
  contents: read

jobs:
  golden-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Wygeneruj wzorce na JVM
        run: ./gradlew :sim:regenerateGolden -PserverOnly=true -PgoldenReason='Utworzenie bazowych wzorców z bieżącego silnika' --console=plain --no-configuration-cache
      - name: Wzorce do zatwierdzenia w repo
        run: |
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path
          for name in sorted(glob.glob('sim/src/test/resources/golden/*.json')):
              print('GOLDEN_JSON', name, json.dumps(Path(name).read_text(encoding='utf-8'), ensure_ascii=True))
          PY
