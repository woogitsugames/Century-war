name: Dostępność - kolory i daltonizm 111

on:
  push:
    branches:
      - gpt/111-colorblind-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  colorblind:
    name: Build, testy kontrastu i zrzuty z filtrami
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kompilacja APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache
      - name: Testy WCAG, symulacje i zrzuty
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*ColorBlindTest*' \
            --tests '*ColorBlindScreenshotTest*' \
            --tests '*LTest*' \
            --tests '*ScreenshotTest.menus*' \
            --console=plain --no-configuration-cache
      - name: Zrzuty ekranów z symulacją daltonizmu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colorblind-111-screenshots
          path: app/build/screenshots/colorblind-111/*.png
          if-no-files-found: warn
          retention-days: 30
